version: '3.8'

services:
  # Stock Data API 服務
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocks-data-api
    environment:
      # 資料庫配置（使用外部資料庫）
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      # API 配置
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
      API_WORKERS: 4

      # 排程器配置
      SCHEDULER_ENABLED: "true"
      SCHEDULER_DAILY_FETCH_TIME: "18:00"

      # 日誌配置
      LOG_LEVEL: INFO

      # Yahoo Finance 配置
      YAHOO_FETCH_INTERVAL: "300"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 掛載日誌目錄
      - ./logs:/app/logs
      # 掛載配置文件（可選，用於開發時修改配置）
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 4

networks:
  stocks-network:
    driver: bridge
