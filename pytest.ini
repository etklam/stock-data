[pytest]
# pytest 配置文件

# 測試目錄
testpaths = tests

# 測試文件模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行選項
addopts =
    # 詳細輸出
    -v
    # 顯示測試覆蓋的 print 語句
    -s
    # 顯示測試摘要
    --tb=short
    # 運行時長超過 10 秒的測試視為失敗
    --timeout=10
    # 並行運行測試（需要 pytest-xdist）
    # -n auto
    # 覆蓋率報告
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    # 忽略警告
    -p no:warnings

# 標記
markers =
    unit: 單元測試
    integration: 集成測試
    slow: 慢速測試
    database: 需要數據庫的測試
    api: 需要 API 服務器的測試

# 日誌
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆蓋率配置
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
